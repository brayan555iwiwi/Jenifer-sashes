        <section>
            <h2>Solicitar Orçamento</h2>
            <form action="/enviar-orcamento" method="POST">
                <fieldset>
                    <legend>Escolha seus serviços</legend>
                    
                    <label for="email_orcamento">Seu E-mail:</label>
                    <input type="email" id="email_orcamento" name="email" required>
                    <br><br>

                    <label>Quais serviços você deseja incluir no pacote?</label><br>
                    <input type="checkbox" id="orc_cilios" name="servicos" value="cilios">
                    <label for="orc_cilios">Cílios</label><br>
                    
                    <input type="checkbox" id="orc_sobrancelha" name="servicos" value="sobrancelha">
                    <label for="orc_sobrancelha">Sobrancelhas</label><br><br>

                    <button type="submit">Pedir Orçamento</button>
                </fieldset>
            </form>
        </section>
